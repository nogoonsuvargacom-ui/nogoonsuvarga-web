<!doctype html>
<html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Үйл ажиллагааны удирдлага</title><style>:root{--g:#14532d;--bg:#f6f8f3;--ink:#173126;--muted:#68786f;--line:#dce6dc;--soft:#edf8ed;--warn:#fff8dd;--err:#fdecec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans", "Noto Sans Cyrillic", "Segoe UI", Arial, sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--g);border:1px solid var(--line)}.btn.reject{background:#fff;color:#8d2c2c;border:1px solid #e8bdbd}.btn:disabled{opacity:.55}.muted{color:var(--muted)}.err,.ok,.notice{padding:12px;border-radius:10px;margin-top:12px}.err{background:var(--err);color:#8d2c2c}.ok{background:var(--soft);color:#24602d}.notice{background:var(--warn);color:#66541c}.row{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:1.4fr .9fr;gap:16px}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:var(--warn);font-size:12px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}</style></head><body><main class="wrap"><h1>Үйл ажиллагааны удирдлага</h1><p class="muted">Захиалга, төлбөрийн баталгаажуулалт, дараагийн шатны хуваарилалт.</p><section id="login" class="card"><h2>Админ нэвтрэх</h2><div class="field"><label>Имэйл</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Нууц үг</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn">Нэвтрэх</button><div id="msg"></div></section><section id="app" class="card" style="display:none"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">Төлбөр баталгаажуулах</h2><button id="logout" class="btn alt">Гарах</button></div><p class="muted">Шинэ захиалга төлбөр баталгаажихаас өмнө нийлүүлэгчид хуваарилагдахгүй.</p><div id="list">Уншиж байна…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('mn-MN').format(Number(n)||0)+' ₮';function show(text,cls){$('msg').className=cls;$('msg').textContent=text}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){show(error.message,'err');return}const {data:isAdmin,error:aerr}=await sb.rpc('is_admin');if(aerr||!isAdmin){await sb.auth.signOut();show('Админ эрх шаардлагатай.','err');return}$('login').style.display='none';$('app').style.display='block';await load()}async function load(){const {data,error}=await sb.from('orders').select('id,order_number,tree_type,quantity,total_amount_mnt,payment_status,payment_confirmation_status,planting_status,location,created_at,site_id,product_id').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="err">'+error.message+'</div>';return}if(!data?.length){$('list').innerHTML='<p class="muted">Одоогоор захиалга алга.</p>';return}const pending=data.filter(o=>o.payment_confirmation_status==='pending_confirmation');const other=data.filter(o=>o.payment_confirmation_status!=='pending_confirmation');let html='';html+='<h3>Хүлээгдэж буй төлбөр ('+pending.length+')</h3>';if(!pending.length)html+='<p class="muted">Шинэ баталгаажуулах захиалга алга.</p>';html+=pending.map(renderPending).join('');html+='<h3 style="margin-top:26px">Сүүлийн захиалгууд</h3>';if(!other.length)html+='<p class="muted">Бусад захиалга алга.</p>';html+=other.slice(0,20).map(renderOther).join('');$('list').innerHTML=html;document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>verify(b.dataset.confirm,'confirmed'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>verify(b.dataset.reject,'rejected'))}function renderPending(o){return `<div class="row"><div class="grid"><div><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${money(o.total_amount_mnt)}</div><div class="muted">${o.location||'Байршилгүй'} · ${new Date(o.created_at).toLocaleString('mn-MN')}</div><div style="margin-top:8px"><span class="status">Төлбөр хүлээгдэж байна</span></div><div style="margin-top:8px" class="muted">Site: ${o.site_id||'—'} · Product: ${o.product_id||'—'}</div></div><div><div class="notice">Баримт/төлбөрийн мэдээллийг нягтлаад шийдвэр гаргана.</div><div class="actions"><button class="btn" data-confirm="${o.id}">Төлбөр баталгаажуулах</button><button class="btn reject" data-reject="${o.id}">Татгалзах</button></div></div></div></div>`}function renderOther(o){const status=o.payment_confirmation_status==='confirmed'?'Баталгаажсан':o.payment_confirmation_status==='rejected'?'Татгалзсан':'Хүлээгдэж байна';return `<div class="row"><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${money(o.total_amount_mnt)}</div><div class="muted">Төлбөр: ${o.payment_status} · ${status} · Тарилт: ${o.planting_status}</div></div>`}async function verify(id,decision){const {data:user}=await sb.auth.getUser();if(!user?.user){alert('Нэвтрэлт шаардлагатай.');return}const updates=decision==='confirmed'?{payment_status:'paid',payment_confirmation_status:'confirmed',planting_status:'payment_verified'}:{payment_status:'pending',payment_confirmation_status:'rejected',planting_status:'ordered'};const {error}=await sb.from('orders').update(updates).eq('id',id);if(error){alert(error.message);return}await load()}$('loginBtn').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};</script></body></html>
