<!doctype html>
<html lang="mn-Cyrl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Үйл ажиллагааны удирдлага</title>
<style>
:root{--g:#14532d;--bg:#f6f8f3;--ink:#173126;--muted:#68786f;--line:#dce6dc;--soft:#edf8ed;--warn:#fff8dd;--err:#fdecec;--blue:#eef5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans","Noto Sans Cyrillic","Segoe UI",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--g);border:1px solid var(--line)}.btn.reject{background:#fff;color:#8d2c2c;border:1px solid #e8bdbd}.btn:disabled{opacity:.55;cursor:not-allowed}.muted{color:var(--muted)}.err,.ok,.notice,.info{padding:12px;border-radius:10px;margin-top:12px}.err{background:var(--err);color:#8d2c2c}.ok{background:var(--soft);color:#24602d}.notice{background:var(--warn);color:#66541c}.info{background:var(--blue);color:#244a72}.row{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:1.25fr .95fr;gap:16px}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:var(--warn);font-size:12px;font-weight:800}.status.paid{background:var(--soft);color:#24602d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.section-title{margin-top:26px}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}
</style>
</head>
<body>
<main class="wrap">
<h1>Үйл ажиллагааны удирдлага</h1>
<p class="muted">Захиалга → төлбөрийн баталгаажуулалт → нийлүүлэгчийн хуваарилалт.</p>
<section id="login" class="card">
<h2>Админ нэвтрэх</h2>
<div class="field"><label>Имэйл</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>Нууц үг</label><input id="password" type="password" autocomplete="current-password"></div>
<button id="loginBtn" class="btn">Нэвтрэх</button><div id="msg"></div>
</section>
<section id="app" class="card hidden">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">Операци</h2><div id="who" class="muted"></div></div><button id="logout" class="btn alt">Гарах</button></div>
<div id="list">Уншиж байна…</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('mn-MN').format(Number(n)||0)+' ₮';
let teams=[],members=[],sites=[],assignments=[];
function show(text,cls){$('msg').className=cls||'';$('msg').textContent=text}
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(r.error){show(r.error.message,'err');return}const a=await sb.rpc('is_admin');if(a.error||!a.data){await sb.auth.signOut();show('Админ эрх шаардлагатай.','err');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=r.data.user.email||'';await load()}
async function load(){
 const [ordersR,teamsR,membersR,sitesR,assignR]=await Promise.all([
  sb.from('orders').select('id,order_number,tree_type,quantity,total_amount_mnt,payment_status,payment_confirmation_status,planting_status,location,created_at,site_id,product_id,planting_scheduled_date,planting_responsible_name').order('created_at',{ascending:false}),
  sb.from('planting_teams').select('id,name,email,phone,active').eq('active',true).order('name'),
  sb.from('team_members').select('id,team_id,user_id,full_name,email,active').eq('active',true).order('full_name'),
  sb.from('planting_sites').select('id,name,location_name,description,published').order('name'),
  sb.from('order_assignments').select('id,order_id,team_id,responsible_user_id,status,assigned_at')
 ]);
 if(ordersR.error){$('list').innerHTML='<div class="err">'+ordersR.error.message+'</div>';return}
 teams=teamsR.data||[];members=membersR.data||[];sites=sitesR.data||[];assignments=assignR.data||[];
 const orders=ordersR.data||[], pending=orders.filter(o=>o.payment_confirmation_status==='pending_confirmation'), paid=orders.filter(o=>o.payment_confirmation_status==='confirmed'&&o.planting_status!=='assigned'&&o.planting_status!=='scheduled'&&o.planting_status!=='planting_started'&&o.planting_status!=='planted'), active=orders.filter(o=>['assigned','scheduled','planting_started'].includes(o.planting_status)), completed=orders.filter(o=>o.planting_status==='planted');
 let html='<h3>Төлбөр баталгаажуулах ('+pending.length+')</h3>';
 html+=pending.length?pending.map(renderPending).join(''):'<p class="muted">Хүлээгдэж буй төлбөр алга.</p>';
 html+='<h3 class="section-title">Төлбөр баталгаажсан, хуваарилах ('+paid.length+')</h3>';
 html+=paid.length?paid.map(renderAssignable).join(''):'<p class="muted">Хуваарилах захиалга алга.</p>';
 html+='<h3 class="section-title">Идэвхтэй хуваарилалт ('+active.length+')</h3>';
 html+=active.length?active.map(renderActive).join(''):'<p class="muted">Идэвхтэй хуваарилалт алга.</p>';
 html+='<h3 class="section-title">Тарьсан ('+completed.length+')</h3>';
 html+=completed.slice(0,20).map(renderSimple).join('')||'<p class="muted">Тарьсан захиалга алга.</p>';
 $('list').innerHTML=html;
 document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>verifyPayment(b.dataset.confirm,'confirmed'));
 document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>verifyPayment(b.dataset.reject,'rejected'));
 document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assignOrder(b.dataset.assign));
}
function renderPending(o){return `<div class="row"><div class="grid"><div><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${money(o.total_amount_mnt)}</div><div class="muted">${o.location||'Байршилгүй'} · ${new Date(o.created_at).toLocaleString('mn-MN')}</div><div style="margin-top:8px"><span class="status">Төлбөр хүлээгдэж байна</span></div></div><div><div class="notice">Төлбөрийн баримтыг шалгаад шийдвэр гаргана.</div><div class="actions"><button class="btn" data-confirm="${o.id}">Төлбөр баталгаажуулах</button><button class="btn reject" data-reject="${o.id}">Татгалзах</button></div></div></div></div>`}
function renderAssignable(o){const aid=assignments.find(a=>a.order_id===o.id);return `<div class="row"><div class="grid"><div><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${money(o.total_amount_mnt)}</div><div class="muted">${o.location||'Байршилгүй'}</div><div style="margin-top:8px"><span class="status paid">Төлбөр баталгаажсан</span></div></div><div><div class="field"><label>Нийлүүлэгчийн баг</label><select data-team="${o.id}"><option value="">Сонгох</option>${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div><div class="field"><label>Хариуцсан хүн</label><select data-person="${o.id}"><option value="">Сонгох</option>${members.map(m=>`<option value="${m.user_id}">${m.full_name}${m.email?' · '+m.email:''}</option>`).join('')}</select></div><div class="field"><label>Тарилтын огноо</label><input data-date="${o.id}" type="date"></div><button class="btn" data-assign="${o.id}" style="margin-top:10px">Хуваарилах</button><div id="am${o.id}"></div></div></div></div>`}
function renderActive(o){const a=assignments.find(x=>x.order_id===o.id);const team=teams.find(t=>t.id===a?.team_id);const person=members.find(m=>m.user_id===a?.responsible_user_id);return `<div class="row"><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${money(o.total_amount_mnt)}</div><div>Тарилт: <b>${o.planting_status}</b></div><div class="muted">Нийлүүлэгч: ${team?.name||'—'} · ${person?.full_name||'—'} · ${o.planting_scheduled_date||'огноо сонгоогүй'}</div></div>`}
function renderSimple(o){return `<div class="row"><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${money(o.total_amount_mnt)}</div><div class="muted">Тарилт: ${o.planting_status}</div></div>`}
async function verifyPayment(id,decision){const updates=decision==='confirmed'?{payment_status:'paid',payment_confirmation_status:'confirmed',planting_status:'payment_verified'}:{payment_status:'pending',payment_confirmation_status:'rejected',planting_status:'ordered'};const r=await sb.from('orders').update(updates).eq('id',id);if(r.error){alert(r.error.message);return}await load()}
async function assignOrder(id){const team=document.querySelector(`[data-team="${id}"]`)?.value||null, person=document.querySelector(`[data-person="${id}"]`)?.value||null, date=document.querySelector(`[data-date="${id}"]`)?.value||null;try{const r=await sb.rpc('manager_assign_order',{p_order_id:id,p_team_id:team,p_responsible_user_id:person,p_scheduled_date:date||null});if(r.error)throw r.error;await load()}catch(e){const box=$('am'+id);if(box){box.className='err';box.textContent=e.message||'Хуваарилахад алдаа гарлаа.'}}}
$('loginBtn').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
</script>
</body></html>
