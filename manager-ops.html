<!doctype html>
<html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Үйл ажиллагааны удирдлага</title><style>:root{--g:#14532d;--bg:#f6f8f3;--ink:#173126;--muted:#68786f;--line:#dce6dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.muted{color:var(--muted)}.err,.ok{padding:12px;border-radius:10px;margin-top:12px}.err{background:#fdecec;color:#8d2c2c}.ok{background:#edf8ed;color:#24602d}.row{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Үйл ажиллагааны удирдлага</h1><p class="muted">Захиалга, төлбөр, баг/хариуцагчийн хуваарилалт.</p><section id="login" class="card"><h2>Админ нэвтрэх</h2><div class="field"><label>Имэйл</label><input id="email" type="email"></div><div class="field"><label>Нууц үг</label><input id="password" type="password"></div><button id="loginBtn" class="btn">Нэвтрэх</button><div id="msg"></div></section><section id="app" class="card" style="display:none"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">Баталгаажсан захиалгууд</h2><button id="logout" class="btn">Гарах</button></div><div id="list">Уншиж байна…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');const $=id=>document.getElementById(id);function show(text,cls){$('msg').className=cls;$('msg').textContent=text}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){show(error.message,'err');return}const {data:isAdmin}=await sb.rpc('is_admin');if(!isAdmin){await sb.auth.signOut();show('Админ эрх шаардлагатай.','err');return}$('login').style.display='none';$('app').style.display='block';load()}async function load(){const {data,error}=await sb.from('orders').select('id,order_number,tree_type,quantity,total_amount_mnt,payment_confirmation_status,planting_status,location,created_at').eq('payment_confirmation_status','confirmed').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="err">'+error.message+'</div>';return}if(!data?.length){$('list').innerHTML='<p class="muted">Одоогоор баталгаажсан захиалга алга.</p>';return}const [{data:teams},{data:members}]=await Promise.all([sb.from('planting_teams').select('id,name,email,active').eq('active',true).order('name'),sb.from('team_members').select('id,team_id,full_name,email,active').eq('active',true).order('full_name')]);$('list').innerHTML=data.map(o=>{const tm=(teams||[]);const mm=(members||[]);return `<div class="row"><div class="grid"><div><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${Number(o.total_amount_mnt).toLocaleString('mn-MN')}₮</div><div class="muted">${o.location} · ${new Date(o.created_at).toLocaleString('mn-MN')}</div><div style="margin-top:8px">Тарилт: ${o.planting_status}</div></div><div><div class="field"><label>Баг</label><select data-team="${o.id}"><option value="">Сонгох</option>${tm.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div><div class="field"><label>Хариуцсан хүн</label><select data-person="${o.id}"><option value="">Сонгох</option>${mm.map(m=>`<option value="${m.id}">${m.full_name}</option>`).join('')}</select></div><div class="field"><label>Төлөвлөсөн огноо</label><input data-date="${o.id}" type="date"></div><button class="btn" data-assign="${o.id}" style="margin-top:10px">Хуваарилах</button></div></div></div>`}).join('');document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.assign;const team=document.querySelector(`[data-team="${id}"]`).value||null;const person=document.querySelector(`[data-person="${id}"]`).value||null;const date=document.querySelector(`[data-date="${id}"]`).value||null;if(!team&&!person){alert('Баг эсвэл хариуцсан хүнээс дор хаяж нэгийг сонгоно уу.');b.disabled=false;return}const {data:user}=await sb.auth.getUser();const r=await sb.from('order_assignments').insert({order_id:id,team_id:team,responsible_user_id:person,assigned_by:user.user.id,status:'assigned'}).select().single();if(r.error){alert(r.error.message);b.disabled=false;return}const {error:uerr}=await sb.from('orders').update({planting_scheduled_date:date,planting_responsible_name:null,notification_status:team||person?'pending':'not_required'}).eq('id',id);if(uerr){alert(uerr.message);b.disabled=false;return}b.textContent='Хуваарилагдсан';b.disabled=true})}$('loginBtn').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};</script></body></html>
