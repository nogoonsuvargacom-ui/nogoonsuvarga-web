<!doctype html><html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Төлбөр баталгаажуулалт</title><style>:root{--g:#14532d;--bg:#f6f8f3;--ink:#173126;--muted:#68786f;--line:#dce6dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:18px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.pill{background:#fff4cc;color:#6a5312;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.muted{color:var(--muted)}.err{background:#fdecec;color:#8d2c2c;padding:12px;border-radius:10px;margin-top:12px}.ok{background:#edf8ed;color:#24602d;padding:12px;border-radius:10px;margin-top:12px}@media(max-width:700px){.row{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><h1>Төлбөр баталгаажуулах</h1><p class="muted">Банкны шилжүүлгийг өөрөө шалгаад эндээс баталгаажуулна.</p><section id="login" class="card"><h2>Нэвтрэх</h2><div class="field"><label>Имэйл</label><input id="email" type="email"></div><div class="field"><label>Нууц үг</label><input id="password" type="password"></div><button id="loginBtn" class="btn">Нэвтрэх</button><div id="loginMsg"></div></section><section id="app" class="card" style="display:none"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 style="margin:0">Хүлээгдэж буй төлбөрүүд</h2><button id="logout" class="btn">Гарах</button></div><div id="list">Уншиж байна…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');const $=id=>document.getElementById(id);function showMsg(text,cls){$('loginMsg').className=cls;$('loginMsg').textContent=text}async function load(){const {data,error}=await sb.from('orders').select('id,order_number,tree_type,quantity,total_amount_mnt,payment_confirmation_status,created_at,user_id').eq('payment_confirmation_status','pending_confirmation').order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="err">'+error.message+'</div>';return}if(!data?.length){$('list').innerHTML='<p class="muted">Хүлээгдэж буй төлбөр алга.</p>';return}$('list').innerHTML=data.map(o=>`<div class="row"><div><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг · ${Number(o.total_amount_mnt).toLocaleString('mn-MN')}₮</div><div class="muted">${new Date(o.created_at).toLocaleString('mn-MN')}</div></div><div><span class="pill">Хүлээгдэж байна</span><br><br><button class="btn" data-id="${o.id}">Баталгаажуулах</button></div></div>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Баталгаажуулж байна…';const {error}=await sb.rpc('confirm_order_payment',{p_order_id:b.dataset.id});if(error){b.disabled=false;b.textContent='Баталгаажуулах';alert(error.message);return}load()})}async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){showMsg(error.message,'err');return}const {data:isAdmin,error:roleErr}=await sb.rpc('is_admin');if(roleErr||!isAdmin){await sb.auth.signOut();showMsg('Энэ аккаунт админ эрхгүй байна.','err');return}$('login').style.display='none';$('app').style.display='block';load()}$('loginBtn').onclick=signIn;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};</script></body></html>
