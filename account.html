<!doctype html><html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Миний Ногоон Суварга</title><style>:root{--g:#14532d;--bg:#f6f8f3;--ink:#173126;--muted:#68786f;--line:#dce6dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:18px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.btn.block{width:100%}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;cursor:pointer}.tabs .active{background:#edf5e9;color:var(--g)}.msg{margin-top:12px;padding:12px;border-radius:10px}.ok{background:#edf8ed;color:#24602d}.err{background:#fdecec;color:#8d2c2c}.info{background:#eef5ff;color:#244a72}.hidden{display:none}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.order{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.top{display:flex;justify-content:space-between;gap:12px}.pill{background:#fff4cc;color:#6a5312;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.pill.confirmed{background:#edf5e9;color:var(--g)}.muted{color:var(--muted)}a{color:var(--g);font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>Миний Ногоон Суварга</h1><p class="muted">Нэг аккаунтаар захиалга, төлбөрийн төлөв болон модныхоо явцыг удирдана.</p><div id="auth"><div class="tabs"><button id="loginTab" class="active">Нэвтрэх</button><button id="signupTab">Шинээр бүртгүүлэх</button></div><div id="nameField" class="field hidden"><label>Нэр</label><input id="name" autocomplete="name"></div><div class="field"><label>Имэйл</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Нууц үг</label><input id="password" type="password" autocomplete="current-password" placeholder="6+ тэмдэгт"></div><button id="submit" class="btn block">Нэвтрэх</button><div id="msg" class="hidden"></div></div><div id="dash" class="hidden"><div class="grid"><section><h2>Миний захиалгууд</h2><div id="orders">Ачааллаж байна…</div><p><a href="/order/">Шинэ Ногоон Суварга захиалах →</a></p></section><aside><div style="background:#edf5e9;border-radius:12px;padding:14px"><strong id="userEmail">—</strong><p>Тарих байршил: Бага модны ам</p><p>Арчилгаа: Ногоон Суварга эхний 2 жил хариуцна.</p></div><button id="logout" class="btn block" style="margin-top:12px">Гарах</button></aside></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');let mode='login';const $=id=>document.getElementById(id);function msg(t,c){$('msg').className='msg '+c;$('msg').textContent=t}function tab(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameField').classList.toggle('hidden',m!=='signup');$('submit').textContent=m==='signup'?'Аккаунт үүсгэх':'Нэвтрэх';$('password').autocomplete=m==='signup'?'new-password':'current-password';$('msg').className='hidden'}async function load(user){$('auth').classList.add('hidden');$('dash').classList.remove('hidden');$('userEmail').textContent=user.email||'Таны аккаунт';const r=await sb.from('orders').select('order_number,tree_type,quantity,total_amount_mnt,payment_status,planting_status,payment_confirmation_status,created_at,location').eq('user_id',user.id).order('created_at',{ascending:false});if(r.error){$('orders').innerHTML='<div class="msg err">Захиалгыг унших үед алдаа гарлаа.</div>';return}if(!r.data.length){$('orders').innerHTML='<p class="muted">Одоогоор захиалга алга байна.</p>';return}$('orders').innerHTML=r.data.map(o=>{const confirmed=o.payment_confirmation_status==='confirmed';const pay=confirmed?'Төлбөр баталгаажсан':'Төлбөр баталгаажуулах хүлээгдэж байна';const plant=o.planting_status==='ordered'?'Захиалга бүртгэгдсэн':(o.planting_status||'Захиалга бүртгэгдсэн');return `<div class="order"><div class="top"><div><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг</div><div class="muted">${Number(o.total_amount_mnt).toLocaleString('mn-MN')}₮ · ${o.location}</div></div><span class="pill ${confirmed?'confirmed':''}">${pay}</span></div><div style="margin-top:8px">Тарилтын төлөв: ${plant}</div></div>`}).join('')}async function submitForm(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('Имэйл болон нууц үгээ оруулна уу.','err');return}if(mode==='signup'&&password.length<6){msg('Нууц үг дор хаяж 6 тэмдэгт байна.','err');return}$('submit').disabled=true;msg('Шалгаж байна…','info');try{let r=mode==='signup'?await sb.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim()}}}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){msg('Аккаунт үүслээ. Имэйл баталгаажуулалт идэвхтэй бол баталгаажуулах имэйл шаардлагатай.','info');return}msg('Амжилттай нэвтэрлээ.','ok');await load(r.data.user)}catch(e){msg(e.message||'Алдаа гарлаа.','err')}finally{$('submit').disabled=false}}$('loginTab').onclick=()=>tab('login');$('signupTab').onclick=()=>tab('signup');$('submit').onclick=submitForm;$('password').onkeydown=e=>{if(e.key==='Enter')submitForm()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.getSession().then(({data})=>{if(data.session)load(data.session.user)});</script></body></html>
