<!doctype html><html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Миний Ногоон Суварга — Test 2</title><style>body{font-family:Arial,sans-serif;background:#f6f8f3;color:#173126;margin:0;padding:40px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #dce6dc;border-radius:18px;padding:28px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8ce;border-radius:10px}.btn{background:#14532d;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;width:100%}.btn:disabled{opacity:.6;cursor:wait}.muted{color:#68786f}.error,.ok,.info{margin-top:12px;padding:12px;border-radius:10px}.error{background:#fdecec;color:#8d2c2c}.ok{background:#edf8ed;color:#24602d}.info{background:#eef5ff;color:#244a72}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:10px;border:1px solid #dce6dc;background:#fff;border-radius:10px;font-weight:700;cursor:pointer}.tabs .active{background:#edf5e9;color:#14532d}.dash{display:none;margin-top:18px}.order{border:1px solid #dce6dc;border-radius:12px;padding:12px;margin-top:10px}.small{font-size:12px}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="card"><h1>Миний Ногоон Суварга</h1><p class="muted">Нэг энгийн аккаунтаар захиалга болон модныхоо явцыг удирдана.</p><div class="tabs"><button id="loginTab" class="active" type="button">Нэвтрэх</button><button id="signupTab" type="button">Шинээр бүртгүүлэх</button></div><div id="nameWrap" class="field hidden"><label for="name">Нэр</label><input id="name" autocomplete="name"></div><div class="field"><label for="email">Имэйл</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label for="password">Нууц үг</label><input id="password" type="password" autocomplete="current-password" placeholder="6+ тэмдэгт"></div><button id="submit" class="btn" type="button">Нэвтрэх</button><div id="msg" class="hidden"></div></div><div id="dash" class="card dash"><h2 id="who"></h2><p id="orders" class="muted">Захиалгуудыг уншиж байна…</p><a class="btn" href="/order/">Захиалах →</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const msg=document.getElementById('msg'),submit=document.getElementById('submit'),loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),nameWrap=document.getElementById('nameWrap'),nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),dash=document.getElementById('dash'),who=document.getElementById('who'),orders=document.getElementById('orders');let mode='login';function show(text,type){msg.className=type;msg.textContent=text}function tab(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');nameWrap.classList.toggle('hidden',m!=='signup');submit.textContent=m==='signup'?'Аккаунт үүсгэх':'Нэвтрэх';passwordEl.setAttribute('autocomplete',m==='signup'?'new-password':'current-password');show('','hidden')}async function load(user){dash.style.display='block';who.textContent=user.email||'Таны аккаунт';const r=await sb.from('orders').select('order_number,tree_type,quantity,total_amount_mnt,planting_status,payment_status,payment_confirmation_status,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(r.error){orders.textContent='Захиалгыг унших үед алдаа гарлаа.';return}orders.innerHTML=r.data&&r.data.length?r.data.map(x=>`<div class="order"><b>${x.order_number}</b><div>${x.tree_type} · ${x.quantity} ширхэг · ${Number(x.total_amount_mnt).toLocaleString('mn-MN')}₮</div><div class="small">Төлбөр: ${x.payment_status==='paid'?'баталгаажсан':'хүлээгдэж байна'}</div></div>`).join(''):'Одоогоор захиалга алга.'}async function submitForm(){show('Шалгаж байна…','info');submit.disabled=true;try{const email=emailEl.value.trim(),password=passwordEl.value;if(!email||!password)throw new Error('Имэйл болон нууц үгээ оруулна уу.');if(mode==='signup'&&password.length<6)throw new Error('Нууц үг дор хаяж 6 тэмдэгт байна.');let result;if(mode==='signup'){result=await sb.auth.signUp({email,password,options:{data:{full_name:nameEl.value.trim()}}});if(result.error)throw result.error;if(result.data.session){show('Аккаунт үүслээ. Та нэвтэрсэн байна.','ok');await load(result.data.user)}else{show('Аккаунт үүсэх хүсэлт амжилттай. Имэйл баталгаажуулалт идэвхтэй бол баталгаажуулах имэйл хэрэгтэй.','info')}}else{result=await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;show('Амжилттай нэвтэрлээ.','ok');await load(result.data.user)}}catch(e){show(e.message||'Нэвтрэх үед алдаа гарлаа.','error')}finally{submit.disabled=false}}if(!window.supabase){show('Supabase сан ачаалагдсангүй. Хуудсыг дахин ачаална уу.','error');return}const sb=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');loginTab.addEventListener('click',()=>tab('login'));signupTab.addEventListener('click',()=>tab('signup'));submit.addEventListener('click',submitForm);passwordEl.addEventListener('keydown',e=>{if(e.key==='Enter')submitForm()});show('Ready. Click the button to test.','info');sb.auth.getSession().then(({data})=>{if(data.session)load(data.session.user)}).catch(()=>{});})();</script></body></html>
