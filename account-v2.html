<!doctype html><html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Миний Ногоон Суварга</title><style>body{font-family:Arial,sans-serif;background:#f6f8f3;color:#173126;margin:0;padding:40px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #dce6dc;border-radius:18px;padding:28px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8ce;border-radius:10px}.btn{background:#14532d;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;width:100%}.muted{color:#68786f}.error,.ok{margin-top:12px;padding:12px;border-radius:10px}.error{background:#fdecec;color:#8d2c2c}.ok{background:#edf8ed;color:#24602d}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:10px;border:1px solid #dce6dc;background:#fff;border-radius:10px;font-weight:700}.tabs .active{background:#edf5e9;color:#14532d}</style></head><body><div class="wrap"><div class="card"><h1>Миний Ногоон Суварга</h1><p class="muted">Нэг энгийн аккаунтаар захиалга болон модныхоо явцыг удирдана.</p><div class="tabs"><button id="loginTab" class="active">Нэвтрэх</button><button id="signupTab">Шинээр бүртгүүлэх</button></div><div id="nameWrap" class="field" style="display:none"><label>Нэр</label><input id="name"></div><div class="field"><label>Имэйл</label><input id="email" type="email"></div><div class="field"><label>Нууц үг</label><input id="password" type="password" placeholder="6+ тэмдэгт"></div><button id="submit" class="btn">Нэвтрэх</button><div id="msg"></div></div><div id="dash" class="card" style="display:none;margin-top:18px"><h2 id="who"></h2><p id="orders" class="muted">Захиалгуудыг уншиж байна…</p><a class="btn" href="/order/">Захиалах →</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');let mode='login';const $=id=>document.getElementById(id);function tab(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameWrap').style.display=m==='signup'?'block':'none';$('submit').textContent=m==='signup'?'Аккаунт үүсгэх':'Нэвтрэх';$('msg').textContent=''}async function load(u){$('dash').style.display='block';$('who').textContent=u.email;const r=await s.from('orders').select('order_number,tree_type,quantity,total_amount_mnt,planting_status,payment_confirmation_status').eq('user_id',u.id).order('created_at',{ascending:false});$('orders').textContent=r.data?.length?`${r.data.length} захиалга байна. ${r.data.map(x=>x.order_number+' · '+x.tree_type).join(' · ')}`:'Одоогоор захиалга алга.'}async function submit(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('msg').className='error',$('msg').textContent='Имэйл болон нууц үгээ оруулна уу.';try{let r;if(mode==='signup'){r=await s.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim()}}})}else{r=await s.auth.signInWithPassword({email,password})}if(r.error)throw r.error;if(!r.data.session){$('msg').className='ok';$('msg').textContent='Аккаунт үүслээ. Имэйл баталгаажуулалт шаардлагатай бол холбоос дээр дарна уу.';return}await load(r.data.user)}catch(e){$('msg').className='error';$('msg').textContent=e.message}}$('loginTab').onclick=()=>tab('login');$('signupTab').onclick=()=>tab('signup');$('submit').onclick=submit;</script></body></html>
