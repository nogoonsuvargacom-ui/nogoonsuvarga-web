<!doctype html><html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Захиалах — Ногоон Суварга</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap"><style>:root{--g:#14532d;--ink:#173126;--muted:#68786f;--bg:#f6f8f3;--line:#dce6dc;--soft:#edf5e9;--warn:#fff8dd;--err:#fdecec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans',Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px}.brand{font-weight:900;color:var(--g);text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 8px 25px #17312610}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d5e0d6;border-radius:10px;background:#fbfcfa;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{display:inline-flex;justify-content:center;align-items:center;width:100%;border:0;border-radius:11px;background:var(--g);color:#fff;padding:13px 16px;font-weight:850;cursor:pointer}.btn.alt{background:#fff;color:var(--g);border:1px solid var(--line)}.btn:disabled{opacity:.6}.hidden{display:none!important}.muted{color:var(--muted)}.notice,.success,.error,.sitebox,.payment{padding:14px;border-radius:12px;margin-top:14px}.notice{background:var(--warn);color:#66541c}.success{background:var(--soft);color:#24602d}.error{background:var(--err);color:#8d2c2c}.sitebox{background:#f1f7ee;border:1px solid #cfe2d0}.sitebox img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:10px}.payment{background:#eef7e9;border:1px dashed #9fc0a3}.bank{font-weight:850;margin:4px 0}.total{border-top:1px solid var(--line);margin-top:16px;padding-top:16px;display:flex;justify-content:space-between;align-items:end}.total strong{font-size:28px;color:var(--g)}.copy{margin-top:10px}.qrimg{max-width:220px;display:block;margin:10px auto}.banks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.banks a{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;text-decoration:none;color:var(--ink)}.checkbtn{margin-top:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p><a class="brand" href="/">NOGOON SUVARGA</a></p><div class="card"><h1>Захиалга</h1><p id="session" class="muted">Акаунт шалгаж байна…</p><div id="loginBox" class="notice hidden">Захиалга хийхийн тулд эхлээд <a href="/account.html">аккаунтаараа нэвтэрнэ үү</a>.</div><div id="siteBox" class="sitebox hidden"></div><form id="form" class="hidden"><div class="field"><label>Тарих талбай *</label><select id="site" required></select></div><div class="grid"><div class="field"><label>Мод *</label><select id="product" required></select></div><div class="field"><label>Тоо ширхэг *</label><input id="qty" type="number" min="1" value="1" required></div></div><div id="productBox" class="sitebox hidden"></div><div class="field"><label>Үйлчилгээ *</label><select id="service"><option value="green">Мод + тарилт + 2 жилийн арчилгаа</option><option value="tree_only">Зөвхөн мод</option></select></div><label id="deliveryRow" class="field hidden"><span style="font-size:12px;font-weight:800">Хүргэлт</span><div style="display:flex;gap:8px;align-items:center;margin-top:7px"><input id="delivery" type="checkbox" style="width:auto"><span id="deliveryText" class="muted"></span></div></label><div class="field"><label>Дурсах хүний нэр</label><input id="honoree" placeholder="Нэр"></div><div class="field"><label>Дурсгалын үг</label><textarea id="dedication" rows="3" placeholder="Таны дурсгалын үг..."></textarea></div><div class="total"><span>Нийт үнэ</span><strong id="total">—</strong></div><button id="submit" class="btn" type="submit">Захиалга үүсгэх →</button></form><div id="result" class="hidden"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://vrifdeskapwepbafeuvv.supabase.co',K='sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK',sb=window.supabase.createClient(U,K),$=id=>document.getElementById(id);let session=null,sites=[],products=[];const money=n=>new Intl.NumberFormat('mn-MN').format(n)+' ₮';const normId=v=>String(v??'').trim();const selected=()=>products.find(p=>normId(p.id)===normId($('product').value));function calc(){const p=selected();if(!p){$('total').textContent='—';return 0}let n=(($('service').value==='tree_only'?Number(p.price_mnt):Number(p.price_mnt)+Number(p.maintenance_price_mnt))*Math.max(1,Number($('qty').value)||1));if($('delivery').checked)n+=Number(p.delivery_fee_mnt)||0;$('total').textContent=money(n);return n}function renderSite(){const s=sites.find(x=>normId(x.id)===normId($('site').value));const b=$('siteBox');if(!s){b.classList.add('hidden');return}b.classList.remove('hidden');b.innerHTML='<strong>'+s.name+'</strong><div>'+s.location_name+'</div><div class="muted">'+(s.description||'')+'</div>'+(s.cover_image_url?'<img src="'+s.cover_image_url+'">':'')}function renderProduct(){const p=selected();const b=$('productBox');if(!p||(!p.description&&!p.image_url)){b.classList.add('hidden');return}b.classList.remove('hidden');b.innerHTML=(p.image_url?'<img src="'+p.image_url+'">':'')+(p.description?'<div class="muted">'+p.description+'</div>':'')}function render(){const sid=normId($('site').value);const list=products.filter(p=>normId(p.site_id)===sid);$('product').innerHTML=list.length?list.map(p=>'<option value="'+p.id+'">'+p.name+' — '+money(p.price_mnt)+'</option>').join(''):'<option value="">Бүтээгдэхүүн байхгүй</option>';if(list.length)$('product').value=list[0].id;const p=selected();if(p&&p.delivery_available){$('deliveryRow').classList.remove('hidden');$('deliveryText').textContent='Хүргэлт '+money(p.delivery_fee_mnt||0)}else{$('deliveryRow').classList.add('hidden');$('delivery').checked=false}renderSite();renderProduct();calc()}async function init(){const r=await sb.auth.getSession();session=r.data.session;if(!session){$('session').textContent='Нэвтрээгүй байна.';$('loginBox').classList.remove('hidden');return}$('session').textContent='Нэвтэрсэн: '+(session.user.email||'');const s=await sb.from('planting_sites').select('id,name,description,location_name,cover_image_url').eq('published',true).order('created_at');if(s.error){$('session').textContent='Талбайн мэдээлэл уншихад алдаа гарлаа.';return}sites=s.data||[];$('site').innerHTML=sites.length?sites.map(x=>'<option value="'+x.id+'">'+x.name+' — '+x.location_name+'</option>').join(''):'<option value="">Талбай бүртгэгдээгүй байна</option>';const p=await sb.from('planting_products').select('id,site_id,name,tree_type,price_mnt,maintenance_price_mnt,delivery_available,delivery_fee_mnt,description,image_url').eq('active',true).order('name');if(p.error){$('session').textContent='Бүтээгдэхүүний мэдээлэл уншихад алдаа гарлаа.';return}products=p.data||[];render();$('form').classList.remove('hidden')}$('site').onchange=render;$('product').onchange=()=>{renderProduct();calc()};$('qty').oninput=calc;$('service').onchange=calc;$('delivery').onchange=calc;async function loadQpay(orderId){const box=document.getElementById('qpayBox');if(!box)return;try{const resp=await fetch(U+'/functions/v1/qpay-create-invoice',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({order_id:orderId})});const body=await resp.json().catch(()=>({}));if(!resp.ok||!body.ok){box.innerHTML='<div class="muted">Онлайн төлбөр (QPay) түр боломжгүй байна. Доорх банкны шилжүүлгийг ашиглана уу.</div>';return}const banks=(body.urls||[]).slice(0,10).map(u=>'<a href="'+u.link+'" target="_blank" rel="noopener">'+u.name+'</a>').join('');box.innerHTML='<div>ОНЛАЙНААР ТӨЛӨХ (QPay)</div>'+(body.qr_image?'<img class="qrimg" src="data:image/png;base64,'+body.qr_image+'">':'')+(body.qpay_shortUrl?'<div style="text-align:center"><a href="'+body.qpay_shortUrl+'" target="_blank" rel="noopener">QPay холбоос нээх →</a></div>':'')+(banks?'<div class="banks">'+banks+'</div>':'')+'<button type="button" class="btn alt checkbtn" id="checkPaidBtn">Төлбөр шалгах</button><div id="paidMsg"></div>';document.getElementById('checkPaidBtn').onclick=()=>checkPaid(orderId)}catch(e){box.innerHTML='<div class="muted">Онлайн төлбөр (QPay) түр боломжгүй байна. Доорх банкны шилжүүлгийг ашиглана уу.</div>'}}async function checkPaid(orderId){const btn=document.getElementById('checkPaidBtn'),msg=document.getElementById('paidMsg');if(btn){btn.disabled=true;btn.textContent='Шалгаж байна…'}const r=await sb.from('orders').select('payment_confirmation_status').eq('id',orderId).maybeSingle();if(r.data?.payment_confirmation_status==='confirmed'){document.getElementById('qpayBox').innerHTML='<div class="success" style="margin:0">Төлбөр баталгаажлаа ✓</div>'}else{if(btn){btn.disabled=false;btn.textContent='Төлбөр шалгах'}if(msg)msg.innerHTML='<div class="muted" style="margin-top:8px">Төлбөр хараахан бүртгэгдээгүй байна.</div>'}}$('form').onsubmit=async e=>{e.preventDefault();const p=selected(),s=sites.find(x=>normId(x.id)===normId($('site').value));if(!p){$('result').className='error';$('result').textContent='Сонгосон талбайд бүтээгдэхүүн алга байна.';$('result').classList.remove('hidden');return}const sum=calc(),orderNumber='NS-'+Date.now().toString().slice(-8);$('submit').disabled=true;$('submit').textContent='Хадгалж байна…';try{const ins=await sb.from('orders').insert({user_id:session.user.id,order_number:orderNumber,tree_type:p.tree_type||p.name,quantity:Math.max(1,Number($('qty').value)||1),total_amount_mnt:sum,payment_status:'pending',payment_confirmation_status:'pending_confirmation',planting_status:'ordered',location:s?.location_name||'',honoree_name:$('honoree').value||null,dedication:$('dedication').value||null,site_id:s?.id||null,product_id:p.id,delivery_requested:$('delivery').checked,delivery_fee_mnt:$('delivery').checked?(p.delivery_fee_mnt||0):0}).select('id').single();if(ins.error)throw ins.error;const orderId=ins.data.id;$('result').className='success';$('result').innerHTML='<strong>Захиалга амжилттай хадгалагдлаа: '+orderNumber+'</strong><div>'+money(sum)+' · Төлбөрийн баталгаажуулалт хүлээгдэж байна.</div><div class="payment" id="qpayBox"><div class="muted">Онлайн төлбөрийн мэдээлэл ачааллаж байна…</div></div><div class="payment"><div>ЭСВЭЛ БАНКНЫ ШИЛЖҮҮЛЭГЭЭР</div><div class="bank">Хүлээн авагч: НОГООН СУВАРГА ГЭРЭЛТ ИРЭЭДҮЙ НҮТББ</div><div class="bank">IBAN: MN39 0004 0004 1720 2271</div><div class="bank">Валют: MNT</div><div>Гүйлгээний утга: <strong>'+orderNumber+'</strong></div><div>Баримт илгээх: <strong>+976 8963 0150</strong></div><button id="copy" type="button" class="btn alt copy">Төлбөрийн мэдээлэл хуулах</button></div>';$('result').querySelector('#copy').onclick=async()=>{await navigator.clipboard?.writeText('Ногоон Суварга\nIBAN: MN39 0004 0004 1720 2271\nВалют: MNT\nГүйлгээний утга: '+orderNumber+'\nБаримт: +976 8963 0150');$('result').querySelector('#copy').textContent='Хуулагдлаа ✓'};loadQpay(orderId)}catch(err){$('result').className='error';$('result').textContent='Захиалга хадгалахад алдаа: '+(err.message||'Алдаа гарлаа.')}finally{$('result').classList.remove('hidden');$('submit').disabled=false;$('submit').textContent='Захиалга үүсгэх →'}};init();</script></body></html>
