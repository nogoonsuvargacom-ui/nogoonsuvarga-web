<!doctype html><html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Захиалах — Ногоон Суварга</title><style>:root{--g:#14532d;--ink:#173126;--muted:#68786f;--bg:#f6f8f3;--line:#dce6dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 8px 25px #17312610}.brand{font-weight:900;color:var(--g);text-decoration:none}.muted{color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d5e0d6;border-radius:10px;background:#fbfcfa;font:inherit}.btn{display:inline-flex;justify-content:center;align-items:center;width:100%;border:0;border-radius:11px;background:var(--g);color:#fff;padding:13px 16px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.6}.notice,.success,.error{padding:13px;border-radius:12px;margin-top:14px}.notice{background:#fff8dd;color:#66541c}.success{background:#edf8ed;color:#24602d}.error{background:#fdecec;color:#8d2c2c}.hidden{display:none}.total{display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.total strong{font-size:27px;color:var(--g)}</style></head><body><div class="wrap"><p><a class="brand" href="/">NOGOON SUVARGA</a></p><div class="card"><h1>Захиалга</h1><p id="sessionText" class="muted">Акаунт шалгаж байна…</p><div id="loginBox" class="notice hidden">Захиалга хийхийн тулд эхлээд <a href="/account.html">аккаунтаараа нэвтэрнэ үү</a>.</div><form id="form" class="hidden"><div class="field"><label>Мод *</label><select required id="tree" name="tree"><option value="Улиас">Улиас</option><option value="Бургас">Бургас</option><option value="Хайлаас">Хайлаас</option></select></div><div class="field"><label>Тоо ширхэг *</label><input required id="qty" name="qty" type="number" min="1" value="1"></div><div class="field"><label>Үйлчилгээ *</label><select id="service" name="service"><option value="green">Тарилт + 2 жилийн арчилгаа</option><option value="tree_only">Зөвхөн мод</option></select></div><div class="field"><label>Тарих байршил</label><input value="Бага модны ам" readonly></div><div class="field"><label>Дурсах хүний нэр</label><input name="honoree" placeholder="Нэр"></div><div class="field"><label>Дурсгалын үг</label><textarea name="dedication" rows="3" placeholder="Таны дурсгалын үг..."></textarea></div><div class="total"><span>Нийт үнэ</span><strong id="total">—</strong></div><p class="muted" style="font-size:12px">Захиалга баталгаажихад төлбөрийн банкны мэдээлэл гарна. Төлбөрийн санхүүгийн баталгаажуулалт тусдаа хийгдэнэ.</p><button id="submit" class="btn" type="submit">Захиалга үүсгэх →</button></form><div id="result" class="success hidden"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://vrifdeskapwepbafeuvv.supabase.co',SUPABASE_KEY='sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const prices={Улиас:69000,Бургас:79000,Хайлаас:89000};const tree=document.getElementById('tree'),qty=document.getElementById('qty'),service=document.getElementById('service'),total=document.getElementById('total'),form=document.getElementById('form'),loginBox=document.getElementById('loginBox'),sessionText=document.getElementById('sessionText'),result=document.getElementById('result'),submit=document.getElementById('submit');let session=null;function money(n){return new Intl.NumberFormat('mn-MN').format(n)+' ₮'}function calc(){const base=(prices[tree.value]||0)*Math.max(1,+qty.value||1);const sum=service.value==='tree_only'?base*2:base;total.textContent=money(sum);return{sum}}tree.onchange=qty.oninput=service.onchange=calc;async function init(){const {data,error}=await sb.auth.getSession();if(error){sessionText.textContent='Акаунт шалгахад алдаа гарлаа.';loginBox.classList.remove('hidden');return}session=data.session;if(!session){sessionText.textContent='Нэвтрээгүй байна.';loginBox.classList.remove('hidden');return}sessionText.textContent='Нэвтэрсэн: '+(session.user.email||'');form.classList.remove('hidden');calc()}sb.auth.onAuthStateChange((_event,nextSession)=>{session=nextSession;if(session){sessionText.textContent='Нэвтэрсэн: '+(session.user.email||'');loginBox.classList.add('hidden');form.classList.remove('hidden');calc()}else{sessionText.textContent='Нэвтрээгүй байна.';form.classList.add('hidden');loginBox.classList.remove('hidden')}});form.onsubmit=async e=>{e.preventDefault();if(!session){location.href='/account.html';return}submit.disabled=true;submit.textContent='Хадгалж байна…';result.classList.add('hidden');const f=new FormData(form),{sum}=calc(),orderNumber='NS-'+Date.now().toString().slice(-8);const payload={user_id:session.user.id,order_number:orderNumber,tree_type:String(f.get('tree')),quantity:Math.max(1,+f.get('qty')||1),total_amount_mnt:sum,payment_status:'paid',payment_confirmation_status:'pending_confirmation',planting_status:'ordered',location:'Бага модны ам',honoree_name:f.get('honoree')||null,dedication:f.get('dedication')||null};try{const {error}=await sb.from('orders').insert(payload);if(error)throw error;result.textContent='Захиалга амжилттай хадгалагдлаа: '+orderNumber+' · '+money(sum)+' · Төлбөрийн баталгаажуулалт хүлээгдэж байна.';result.className='success';result.classList.remove('hidden')}catch(err){result.textContent='Захиалга хадгалахад алдаа: '+(err.message||'Алдаа гарлаа.');result.className='error';result.classList.remove('hidden')}finally{submit.disabled=false;submit.textContent='Захиалга үүсгэх →'}};init();</script></body></html>
