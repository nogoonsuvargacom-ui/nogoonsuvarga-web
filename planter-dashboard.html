<!doctype html><html lang="mn-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тарилтын багийн самбар</title><style>:root{--g:#14532d;--bg:#f6f8f3;--ink:#173126;--muted:#68786f;--line:#dce6dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.muted{color:var(--muted)}.err,.ok{padding:12px;border-radius:10px;margin-top:12px}.err{background:#fdecec;color:#8d2c2c}.ok{background:#edf8ed;color:#24602d}.row{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.hidden{display:none!important}.photo{margin-top:10px}@media(max-width:760px){.wrap{padding:16px}}</style></head><body><main class="wrap"><h1>Тарилтын багийн самбар</h1><p class="muted">Танд хуваарилагдсан захиалга, тарилтын явц болон нотлох зураг.</p><section id="login" class="card"><h2>Нэвтрэх</h2><div class="field"><label>Имэйл</label><input id="email" type="email"></div><div class="field"><label>Нууц үг</label><input id="password" type="password"></div><button id="loginBtn" class="btn">Нэвтрэх</button><div id="msg"></div></section><section id="app" class="card" style="display:none"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">Миний ажлууд</h2><button id="logout" class="btn">Гарах</button></div><div id="list">Уншиж байна…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');const $=id=>document.getElementById(id);function msg(t,c){$('msg').className=c;$('msg').textContent=t}async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg(error.message,'err');return}const {data:user}=await sb.auth.getUser();const {data:member}=await sb.from('team_members').select('id,team_id,full_name,email,active').eq('user_id',user.user.id).eq('active',true).maybeSingle();if(!member){await sb.auth.signOut();msg('Энэ аккаунт тарилтын багийн гишүүнээр бүртгэгдээгүй байна.','err');return}$('login').style.display='none';$('app').style.display='block';load(user.user.id)}async function load(uid){const {data:assignments,error}=await sb.from('order_assignments').select('id,order_id,team_id,responsible_user_id,status').eq('responsible_user_id',uid).order('assigned_at',{ascending:false});if(error){$('list').innerHTML='<div class="err">'+error.message+'</div>';return}if(!assignments?.length){$('list').innerHTML='<p class="muted">Одоогоор танд хуваарилсан ажил алга.</p>';return}const ids=assignments.map(x=>x.order_id);const {data:orders}=await sb.from('orders').select('id,order_number,tree_type,quantity,total_amount_mnt,location,honoree_name,dedication,planting_status,planting_scheduled_date').in('id',ids);$('list').innerHTML=assignments.map(a=>{const o=(orders||[]).find(x=>x.id===a.order_id);if(!o)return '';return `<div class="row"><strong>${o.order_number}</strong><div>${o.tree_type} · ${o.quantity} ширхэг</div><div class="muted">${o.location}</div><div style="margin-top:8px">Захиалагчийн дурсамж: ${o.honoree_name||o.dedication||'—'}</div><div>Төлөв: <b>${o.planting_status}</b></div><div>Төлөвлөсөн: ${o.planting_scheduled_date||'Одоогоор товлоогүй'}</div><div class="field"><label>Статус шинэчлэх</label><select data-status="${a.id}" style="width:100%;padding:10px;border:1px solid #dce6dc;border-radius:9px"><option value="assigned">Хуваарилагдсан</option><option value="scheduled">Тарилт товлогдсон</option><option value="planting_started">Тарилт эхэлсэн</option><option value="planted">Тарьсан</option></select></div><div class="field"><label>Тэмдэглэл</label><textarea data-note="${a.id}" rows="3" placeholder="Тарилтын тухай тэмдэглэл"></textarea></div><div class="photo"><label style="display:block;font-size:12px;font-weight:800;margin-bottom:4px">Нотлох зураг (дараагийн алхамд storage холбоно)</label><input type="file" accept="image/*" data-photo="${a.id}"></div><button class="btn" data-save="${a.id}" style="margin-top:10px">Хадгалах</button><div id="m${a.id}"></div></div>`}).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save))}async function save(aid){const status=document.querySelector(`[data-status="${aid}"]`).value;const note=document.querySelector(`[data-note="${aid}"]`).value.trim();const file=document.querySelector(`[data-photo="${aid}"]`).files[0];const {data:ass}=await sb.from('order_assignments').select('order_id').eq('id',aid).single();if(!ass)return;const updates={planting_status:status==='planted'?'planted':status};const {error}=await sb.from('orders').update(updates).eq('id',ass.order_id);if(error){alert(error.message);return}if(file){alert('Зураг сонгогдлоо. Storage upload-ийг дараагийн алхамд холбож, хадгалалтыг идэвхжүүлнэ.')}document.getElementById('m'+aid).className='ok';document.getElementById('m'+aid).textContent='Шинэчлэлт хадгалагдлаа.'}$('loginBtn').onclick=signIn;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()}</script></body></html>
