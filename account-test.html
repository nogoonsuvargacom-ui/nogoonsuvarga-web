<!doctype html>
<html lang="mn-Cyrl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ногоон Суварга — Account Test</title><style>body{font-family:Arial,sans-serif;background:#f6f8f3;color:#173126;margin:0;padding:40px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #dce6dc;border-radius:18px;padding:28px;box-shadow:0 8px 24px #17312612}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8ce;border-radius:10px}.btn{background:#14532d;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;width:100%}.muted{color:#68786f}.error,.ok{margin-top:12px;padding:12px;border-radius:10px}.error{background:#fdecec;color:#8d2c2c}.ok{background:#edf8ed;color:#24602d}.hidden{display:none}.order{border:1px solid #dce6dc;border-radius:12px;padding:14px;margin-top:12px}.status{display:inline-block;background:#e9f5e9;color:#14532d;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}</style></head>
<body><div class="wrap"><div class="card"><h1>Account test</h1><p class="muted">Түр зуурын нууц үгээр нэвтрэх тест. Энэ хуудсыг launch хийхийн өмнө устгана.</p><div class="field"><label>Имэйл</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Нууц үг</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="login">Нэвтрэх</button><div id="msg" class="hidden"></div></div><div id="dash" class="card hidden" style="margin-top:18px"><h2 id="who"></h2><div id="orders"></div><button class="btn" id="logout" style="margin-top:16px">Гарах</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabase=window.supabase.createClient('https://vrifdeskapwepbafeuvv.supabase.co','sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK');
const $=id=>document.getElementById(id);function show(el){el.classList.remove('hidden')}function hide(el){el.classList.add('hidden')}function msg(text,type){show($('msg'));$('msg').className=type;$('msg').textContent=text}
async function load(){const {data:{session}}=await supabase.auth.getSession();if(!session){hide($('dash'));return;}show($('dash'));hide($('msg'));$('who').textContent=session.user.email||'Account';const {data,error}=await supabase.from('orders').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});if(error){$('orders').innerHTML='<div class="error">'+error.message+'</div>';return;}$('orders').innerHTML=data.length?data.map(o=>`<div class="order"><strong>${o.order_number}</strong><br>${o.tree_type} · ${o.quantity} ширхэг<br>${Number(o.total_amount_mnt).toLocaleString('mn-MN')}₮<br><span class="status">${o.planting_status}</span> · <span class="status">${o.payment_confirmation_status||o.payment_status}</span></div>`).join(''):'<p class="muted">Одоогоор захиалга алга.</p>';}
$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Имэйл болон нууц үгээ оруулна уу.','error');$('login').disabled=true;const {error}=await supabase.auth.signInWithPassword({email,password});$('login').disabled=false;if(error)return msg(error.message,'error');await load();};$('logout').onclick=async()=>{await supabase.auth.signOut();await load();};load();
</script></body></html>
