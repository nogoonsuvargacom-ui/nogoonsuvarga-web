<!doctype html>
<html lang="mn-Cyrl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ногоон Суварга — Account Test</title><style>body{font-family:Arial,sans-serif;background:#f6f8f3;color:#173126;margin:0;padding:40px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #dce6dc;border-radius:18px;padding:28px;box-shadow:0 8px 24px #17312612}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8ce;border-radius:10px}.btn{background:#14532d;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;width:100%}.btn:disabled{opacity:.55;cursor:wait}.muted{color:#68786f}.error,.ok,.info{margin-top:12px;padding:12px;border-radius:10px;white-space:pre-wrap}.error{background:#fdecec;color:#8d2c2c}.ok{background:#edf8ed;color:#24602d}.info{background:#eef4ff;color:#244a7b}.hidden{display:none}.order{border:1px solid #dce6dc;border-radius:12px;padding:14px;margin-top:12px}.status{display:inline-block;background:#e9f5e9;color:#14532d;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}</style></head>
<body><div class="wrap"><div class="card"><h1>Account test</h1><p class="muted">Түр зуурын нууц үгээр нэвтрэх тест. Launch хийхийн өмнө энэ хуудсыг устгана.</p><div id="status" class="info">Бэлэн. Нэвтрэх товчийг дарна уу.</div><div class="field"><label>Имэйл</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Нууц үг</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="login">Нэвтрэх</button><div id="msg" class="hidden"></div></div><div id="dash" class="card hidden" style="margin-top:18px"><h2 id="who"></h2><div id="orders"></div><button class="btn" id="logout" style="margin-top:16px">Гарах</button></div></div>
<script>
const BASE='https://vrifdeskapwepbafeuvv.supabase.co';
const KEY='sb_publishable_7R4OeXDJIJ9kFGQ0s7Axvw_BItBPtSK';
const TOKEN_KEY='nogoon_suvarga_test_access_token';
const USER_KEY='nogoon_suvarga_test_user';
const $=id=>document.getElementById(id);
function status(text,type='info'){const el=$('status');el.className=type;el.textContent=text}
function msg(text,type){const el=$('msg');el.className=type;el.textContent=text}
function show(el){el.classList.remove('hidden')}function hide(el){el.classList.add('hidden')}
let accessToken=localStorage.getItem(TOKEN_KEY)||null;
let user=JSON.parse(localStorage.getItem(USER_KEY)||'null');
async function api(path,options={}){const headers={'apikey':KEY,'Content-Type':'application/json',...(options.headers||{})};if(accessToken)headers.Authorization='Bearer '+accessToken;const r=await fetch(BASE+path,{...options,headers});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error((data&&data.msg)||(data&&data.message)||text||('HTTP '+r.status));return data}
async function loadSession(){
 if(!accessToken||!user){status('Бэлэн. Нэвтрэх товчийг дарна уу.','info');return;}
 try{
  $('who').textContent=user.email||'Account';show($('dash'));status('Нэвтэрсэн. Захиалгуудыг уншиж байна…','ok');
  const rows=await api('/rest/v1/orders?select=*&user_id=eq.'+encodeURIComponent(user.id)+'&order=created_at.desc');
  $('orders').innerHTML=rows.length?rows.map(o=>`<div class="order"><strong>${o.order_number}</strong><br>${o.tree_type} · ${o.quantity} ширхэг<br>${Number(o.total_amount_mnt).toLocaleString('mn-MN')}₮<br><span class="status">${o.planting_status}</span> · <span class="status">${o.payment_confirmation_status||o.payment_status}</span></div>`).join(''):'<p class="muted">Одоогоор захиалга алга.</p>';
  status('Бүх шалгалт амжилттай. Account → Supabase → orders ажиллаж байна.','ok');
 }catch(e){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);accessToken=null;user=null;hide($('dash'));status('Нэвтрэх сесс дууссан байна.','error');msg(e.message,'error');}
}
$('login').onclick=async()=>{
 const email=$('email').value.trim(), password=$('password').value;
 if(!email||!password){msg('Имэйл болон нууц үгээ оруулна уу.','error');return;}
 $('login').disabled=true;status('Supabase-тэй холбогдож байна…','info');
 try{
   const auth=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
   accessToken=auth.access_token; user=auth.user;
   localStorage.setItem(TOKEN_KEY,accessToken);localStorage.setItem(USER_KEY,JSON.stringify(user));
   status('Амжилттай нэвтэрлээ. Захиалгуудыг уншиж байна…','ok');
   $('who').textContent=auth.user?.email||email; show($('dash')); hide($('msg'));
   const rows=await api('/rest/v1/orders?select=*&user_id=eq.'+encodeURIComponent(auth.user.id)+'&order=created_at.desc');
   $('orders').innerHTML=rows.length?rows.map(o=>`<div class="order"><strong>${o.order_number}</strong><br>${o.tree_type} · ${o.quantity} ширхэг<br>${Number(o.total_amount_mnt).toLocaleString('mn-MN')}₮<br><span class="status">${o.planting_status}</span> · <span class="status">${o.payment_confirmation_status||o.payment_status}</span></div>`).join(''):'<p class="muted">Одоогоор захиалга алга.</p>';
   status('Бүх шалгалт амжилттай. Account → Supabase → orders ажиллаж байна.','ok');
 }catch(e){status('Нэвтрэхэд алдаа гарлаа.','error');msg(e.message,'error');hide($('dash'));}finally{$('login').disabled=false;}
};
$('logout').onclick=()=>{accessToken=null;user=null;localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);hide($('dash'));status('Гарлаа. Дахин нэвтэрч туршиж болно.','info');};
loadSession();
</script></body></html>
